<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICT Grade 4 — Digital Quest</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--ink:#10224a;--ok:#1e9e5a;--bad:#d9363e;--yel:#ffd93b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:var(--ink);background:#0e2a5c radial-gradient(circle at 24px 24px,#3a6cc0 2px,transparent 3px) 0 0/48px 48px;-webkit-tap-highlight-color:transparent}
#app{max-width:880px;margin:0 auto;padding:12px 14px 40px}
button{font:inherit;cursor:pointer;min-height:48px;border:0;border-radius:14px;color:var(--ink)}
.b{background:var(--yel);font-weight:800;padding:12px 22px;box-shadow:0 4px 0 #c9a400;font-size:1.1rem;margin:5px}
.b:active{transform:translateY(3px);box-shadow:none}
.b.sm{min-height:44px;padding:8px 14px;font-size:.95rem}
.b.alt{background:#fff;box-shadow:0 4px 0 #b8c4dd}
.b[disabled]{opacity:.4}
.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 6px 0 #0006;margin-bottom:14px}
.hero{position:relative;overflow:hidden;text-align:center}
.hero .r{position:absolute;left:0;top:0;width:38%;height:70px;background:#e8433f}
.hero .p{position:absolute;left:32%;top:34px;width:70px;height:70px;background:#6a3fa0}
.ban{position:relative;display:flex;align-items:center;gap:10px;background:var(--yel);border-radius:14px;padding:8px 12px;margin:8px 0 6px;text-align:left}
.ring{flex:none;width:64px;height:64px;border-radius:50%;border:4px solid #fff;background:#e8433f;color:#fff;font-size:2rem;font-weight:900;display:grid;place-items:center;line-height:.9;padding-top:4px}
.ring small{display:block;font-size:.55rem;font-weight:700}
.tt{font-weight:900;font-size:1.2rem}
h1{margin:6px 0;font-size:1.7rem;color:#6a3fa0}
h2{font-size:1.3rem;margin:4px 0 10px}
.brand{display:inline-block;background:#e8433f;color:#fff;font-weight:900;letter-spacing:1px;font-size:1.3rem;padding:8px 18px;border-radius:30px;margin:6px}
input{font:inherit;font-size:1.2rem;padding:12px;border:3px solid #6a3fa0;border-radius:14px;width:min(100%,320px);text-align:center}
.err{color:var(--bad);font-weight:700;min-height:24px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;flex-wrap:wrap;margin-bottom:8px}
.chip{background:#fff;color:var(--ink);border-radius:20px;padding:6px 12px;font-weight:700}
.bar{height:16px;background:#fff3;border-radius:10px;overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd93b,#3fd17a);transition:width .5s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px}
.cd{perspective:600px;background:none;padding:0;min-height:96px;box-shadow:none}
.fl{position:relative;width:100%;height:96px;transition:transform .5s;transform-style:preserve-3d}
.cd.flip .fl{transform:rotateY(180deg)}
.fl>div{position:absolute;inset:0;border-radius:16px;display:grid;place-items:center;font-weight:900;backface-visibility:hidden;color:#fff;font-size:1.6rem;box-shadow:0 4px 0 #0005}
.fr{background:linear-gradient(135deg,#6a3fa0,#2f6fe0)}
.fr small{font-size:.9rem;display:block;text-align:center}
.bk{background:var(--yel);transform:rotateY(180deg);color:var(--ink)}
.cd.sel .fr{outline:4px solid var(--yel)}
.cd.ok .fr{background:var(--ok)}.cd.no .fr{background:var(--bad)}
.cd.ok,.cd.no{opacity:.85}
.cd.bonus .fr{background:linear-gradient(135deg,#e8433f,#ffb100)}
.cd[disabled]{cursor:default}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#eef3ff;border:3px solid #c5d3f3;padding:10px 14px;margin:8px 0;font-size:1.1rem;font-weight:600;min-height:52px}
.opt b{flex:none;width:30px;height:30px;border-radius:50%;background:#6a3fa0;color:#fff;display:grid;place-items:center}
.opt.ok{background:#d6f5e3;border-color:var(--ok)}.opt.no{background:#fde0e1;border-color:var(--bad)}
.opt.on{border-color:#6a3fa0;background:#ece2fa}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{margin-top:12px;padding:12px;border-radius:14px;font-size:1.05rem}
.fb.ok{background:#d6f5e3}.fb.no{background:#fde0e1}
.big{font-size:3rem;text-align:center}
.lv{font-size:1.8rem;font-weight:900;text-align:center;color:#6a3fa0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.stats div{background:#eef3ff;border-radius:12px;padding:10px;text-align:center;font-weight:700}
.stats span{display:block;font-size:1.5rem}
.rv{border-bottom:2px solid #e3e9f7;padding:8px 0}
table{border-collapse:collapse;width:100%;font-size:.9rem}td,th{border:1px solid #c5d3f3;padding:4px 6px;text-align:left}
.pic{text-align:center;font-size:4rem}
@media(max-width:520px){.tt{font-size:1rem}h1{font-size:1.4rem}.cols{gap:6px}}
.art{width:100%;display:block;border-radius:14px;margin-bottom:6px}
.tabs{display:flex;gap:8px;margin:10px 0}
.tab{flex:1;background:#eef3ff;border:3px solid #c5d3f3;font-weight:800;padding:8px;min-height:52px;font-size:1rem}
.tab.on{background:var(--yel);border-color:#6a3fa0}
button,.opt,.cd{touch-action:manipulation;-webkit-user-select:none;user-select:none}
html{-webkit-text-size-adjust:100%}
@media(max-width:520px){#app{padding:8px 8px 32px}.card{padding:14px}.brand{font-size:1.1rem}}
</style></head>

let S={name:'',best:null};
const layout=(q,pos)=>{const o=sh(q.o.slice(1));o.splice(pos,0,q.o[0]);return o};
function newGame(order){
 const mc=Q.filter(q=>q.ty=='mcq');let p=[];while(p.length<mc.length)p.push(...sh([0,1,2,3]));
 const P={};mc.forEach((q,i)=>P[q.id]=p[i]);
 S.ids=order||sh(Q.filter(q=>!q.b).map(q=>q.id));S.P=P;S.res={};S.cur=null;S.retry=null;cards();
}
const nOthers=()=>Q.filter(q=>!q.b).length;
const answered=()=>Object.keys(S.res).length;
const score=()=>Object.values(S.res).reduce((a,r)=>a+r.m,0);
let maxM=Q.reduce((a,q)=>a+q.m,0);
/* ===== cover ===== */
let TAB='l6';
function cover(){
 const l6=TAB=='l6';
 A.innerHTML=`<div class="card hero"><img class="art" src="${ART}" alt="Engineer Nihal Badawy, ICT Grade 4">
 <h1>ICT Grade 4 — Digital Quest</h1><div class="brand">ENG.NIHAL BADAWY</div>
 <div class="tabs" role="tablist"><button role="tab" aria-selected="${l6}" class="tab ${l6?'on':''}" data-t="l6">Lesson 6</button><button role="tab" aria-selected="${!l6}" class="tab ${l6?'':'on'}" data-t="u2l1">Unit 2 · Lesson 1</button></div>
 <div role="tabpanel">${l6?`<h2>Sources of Data Collection and Analysis</h2>
 <p>Hello, tech explorer! Answer ICT challenges, earn marks, unlock levels and learn from your mistakes. Flip the cards and let’s go!</p>
 <input id="nm" placeholder="Type your name" maxlength="24" autocomplete="off" value="${esc(S.name)}"><div class="err" id="er"></div>
 <button class="b" id="go">▶ START GAME</button>`:`<h2>Unit 2 · Lesson 1</h2><p>🚧 This lesson’s challenge is coming soon. Let’s play Lesson 6 for now!</p><button class="b" id="to6">Go to Lesson 6</button>`}</div></div>`;
 document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{const nm=$('#nm');if(nm)S.name=nm.value;TAB=t.dataset.t;cover()});
 if(l6)$('#go').onclick=()=>{const n=$('#nm').value.trim();if(!n){$('#er').textContent='Please type your name to start.';$('#nm').focus();return}S.name=n;Q=Q6;maxM=Q.reduce((a,q)=>a+q.m,0);beep(520);newGame()};
 else $('#to6').onclick=()=>{TAB='l6';cover()};
}
/* ===== cards ===== */
const ICONS=['💻','🖱️','⌨️','🤖','📡','🔌','🖥️','💾','🔍','📈'];
function cards(){
 const done=answered(),all=Q.length,bonusOpen=done>=nOthers();
 const card=(id,n,b)=>{const r=S.res[id],st=r?(r.ok?'ok':'no'):S.cur===id?'sel':'';const lock=b&&!bonusOpen;
  return `<button class="cd ${st} ${b?'bonus':''}" data-i="${id}" ${r||lock?'disabled':''} aria-label="Question card ${n}${r?(r.ok?', answered correctly':', answered'):lock?', locked':''}"><div class="fl"><div class="fr">${r?(r.ok?'✅':'❌'):lock?'🔒':b?'⭐':ICONS[n%10]}<small>${b?'Bonus':n}</small></div><div class="bk">GO!</div></div></button>`};
 A.innerHTML=`<div class="top"><span class="chip">👋 ${esc(S.name)}</span><span class="chip">⭐ ${score()} / ${maxM}</span><button class="b sm alt" id="mu">${mute?'🔇 Sound off':'🔊 Sound on'}</button></div>
 <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${all}" aria-valuenow="${done}"><i style="width:${done/all*100}%"></i></div>
 <div class="card"><h2>Pick a card to flip!</h2><div class="grid">${S.ids.map((id,i)=>card(id,i+1,0)).join('')}${card(Q.length-1,'B',1)}</div><p>${done} of ${all} challenges done. Finish them all to unlock the ⭐ bonus round!</p></div>`;
 $('#mu').onclick=()=>{mute=!mute;cards()};
 document.querySelectorAll('.cd').forEach(c=>c.onclick=()=>{const id=+c.dataset.i;if(S.res[id])return;S.cur=id;c.classList.add('flip');beep(440,.08);setTimeout(()=>openQ(id),520)});
}
function openQ(id){
 const q=Q[id];showQ(q,S.P[id]??0,(ok,txt)=>{if(S.res[id])return;S.res[id]={ok,resp:txt,m:ok?q.m:0};S.cur=null;answered()>=Q.length?results():cards()},true);
}
/* ===== question screen (used by game and retry) ===== */
function showQ(q,pos,done,back,head){
 A.innerHTML=`<div class="top">${back?'<button class="b sm alt" id="bk">← Cards</button>':'<span></span>'}<span class="chip">${head||''} ${TY[q.ty]} · ${q.m} mark${q.m>1?'s':''}</span></div><div class="card"><h2>${q.q}</h2>${q.pic||''}<div id="in"></div><div id="fb" aria-live="polite"></div></div>`;
 if(back)$('#bk').onclick=()=>{S.cur=null;cards()};
 const inn=$('#in');let fin=false,optBtns=[];
 const finish=(ok,txt)=>{if(fin)return;fin=true;ok?sOk():sNo();if(back)$('#bk').remove();
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'🎉 Correct! Great job!':'❌ Not quite. Keep going!'}</b><br>Correct answer: <b>${esc(ansText(q))}</b><br>${esc(q.e)}</div><button class="b" id="nx">Continue ➜</button>`;
  $('#nx').onclick=()=>done(ok,txt);$('#nx').focus();};
 if(q.ty=='mcq'||q.ty=='tf'||q.ty=='fill'){
  const ans=ansText(q),opts=q.ty=='mcq'?layout(q,pos):q.ty=='tf'?['True','False']:sh(BANK);
  inn.innerHTML=opts.map((o,i)=>`<button class="opt"><b>${q.ty=='mcq'?'ABCD'[i]:'•'}</b>${esc(o)}</button>`).join('');
  optBtns=[...inn.children];
  optBtns.forEach((b,i)=>b.onclick=()=>{if(fin)return;optBtns.forEach((x,j)=>{x.disabled=true;if(opts[j]==ans)x.classList.add('ok')});if(opts[i]!=ans)b.classList.add('no');finish(opts[i]==ans,opts[i])});
 }else if(q.ty=='short'){
  inn.innerHTML='<input id="sa" placeholder="Type your answer" autocomplete="off"><br><button class="b" id="ck">Check ✔</button>';
  $('#ck').onclick=()=>{const v=$('#sa').value.trim();if(!v){$('#sa').focus();return}$('#sa').disabled=true;$('#ck').disabled=true;finish(q.acc.includes(v.toLowerCase().replace(/[^a-z ]/g,'').trim()),v)};
 }else if(q.ty=='match'){
  const R=sh(q.pairs.map(p=>p[1]));let sel=null,map={};
  const draw=()=>{inn.innerHTML=`<p>Tap a left item, then tap its match.</p><div class="cols"><div>${q.pairs.map((p,i)=>`<button class="opt ${sel===i?'on':''}" data-l="${i}"><b>${i+1}</b>${esc(p[0])}</button>`).join('')}</div><div>${R.map((r,j)=>{const k=Object.keys(map).find(x=>map[x]===r);return `<button class="opt ${k!==undefined?'on':''}" dir="auto" data-r="${j}">${k!==undefined?'<b>'+(+k+1)+'</b>':''}${esc(r)}</button>`}).join('')}</div></div><button class="b" id="ck" ${Object.keys(map).length<q.pairs.length?'disabled':''}>Check ✔</button>`;
   inn.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{sel=+b.dataset.l;draw()});
   inn.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{if(sel===null)return;const r=R[+b.dataset.r];Object.keys(map).forEach(k=>{if(map[k]===r)delete map[k]});map[sel]=r;sel=null;draw()});
   $('#ck').onclick=()=>{const ok=q.pairs.every((p,i)=>map[i]===p[1]);inn.querySelectorAll('button').forEach(x=>x.disabled=true);finish(ok,q.pairs.map((p,i)=>p[0]+' = '+(map[i]||'?')).join(' ; '))};
  };draw();
 }else if(q.ty=='order'){
  const items=sh(q.steps);let pk=[];
  const draw=()=>{inn.innerHTML=`<p>Tap the steps in the right order. Tap a chosen step to remove it.</p><div>${pk.map((s,i)=>`<button class="opt on" data-p="${i}"><b>${i+1}</b>${esc(s)}</button>`).join('')}</div><hr>${items.filter(s=>!pk.includes(s)).map(s=>`<button class="opt" data-s="${esc(s)}">${esc(s)}</button>`).join('')}<button class="b" id="ck" ${pk.length<items.length?'disabled':''}>Check ✔</button>`;
   inn.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pk.splice(+b.dataset.p,1);draw()});
   inn.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{pk.push(items.find(s=>esc(s)==b.dataset.s));draw()});
   $('#ck').onclick=()=>{const ok=pk.every((s,i)=>s==q.steps[i]);inn.querySelectorAll('button').forEach(x=>x.disabled=true);finish(ok,pk.join(' → '))};
  };draw();
 }
}
/* ===== results ===== */
const LV=p=>p>=90?['ICT Master','🏆','You are a true ICT Master. Amazing work!']:p>=75?['Digital Expert','🥇','Great job! You are a Digital Expert!']:p>=60?['Rising Tech Star','🌟','Well done! You are a Rising Tech Star. A little more practice and you will shine even brighter!']:['Keep Practising','💪','Good try! Every mistake helps you learn. Let’s practise and improve!'];
function results(){
 const sc=score(),pct=Math.round(sc/maxM*1000)/10,ok=Object.values(S.res).filter(r=>r.ok).length,bad=answered()-ok,[lv,ic,msg]=LV(pct);
 const prev=S.best;if(S.best===null||pct>S.best)S.best=pct;
 const tops={};Q.forEach(q=>{const t=tops[q.tp]=tops[q.tp]||{n:0,ok:0};t.n++;const r=S.res[q.id];if(r&&r.ok)t.ok++});
 const good=Object.keys(tops).filter(k=>tops[k].ok==tops[k].n),weak=Object.keys(tops).filter(k=>tops[k].ok<tops[k].n).sort((a,b)=>(tops[b].n-tops[b].ok)-(tops[a].n-tops[a].ok));
 const tys={};Q.forEach(q=>{const t=tys[q.ty]=tys[q.ty]||{n:0,w:0};t.n++;const r=S.res[q.id];if(r&&!r.ok)t.w++});
 const hardTy=Object.keys(tys).filter(k=>tys[k].w>=2&&tys[k].w/tys[k].n>=.5).map(k=>TY[k]);
 const badges=[];const all=k=>tops[k].ok==tops[k].n;
 if(all('c'))badges.push('🔎 Source Spotter');if(all('t'))badges.push('🛡️ Trust Guardian');if(all('a'))badges.push('📈 Trend Finder');if(all('g'))badges.push('📊 Graph Maker');if(all('x'))badges.push('🧮 Excel Explorer');if(S.res[Q.length-1]&&S.res[Q.length-1].ok)badges.push('⭐ Bonus Hero');
 const stars=Math.max(pct>0?1:0,Math.round(pct/20));
 const recs=[];
 if(weak.length)recs.push('Read '+REF[weak[0]]+' again, then try the practice questions.');
 if(bad)recs.push('Press RETRY INCORRECT QUESTIONS to practise the ones you missed.');
 if(weak.length>1)recs.push('Next, review '+REF[weak[1]]+'.');
 if(!bad)recs.push('Challenge a friend, or press SHUFFLE AND REPLAY to try the questions in a new order.');
 A.innerHTML=`<div class="card"><div class="big">${ic}</div><div class="lv">${lv}</div><p style="text-align:center">${esc(S.name)}, ${msg}</p><div class="big" aria-label="${stars} stars">${'⭐'.repeat(stars)}</div>
 <div class="stats"><div><span>${sc} / ${maxM}</span>Marks</div><div><span>${pct}%</span>Percentage</div><div><span>${ok}</span>Correct</div><div><span>${bad}</span>Incorrect</div><div><span>${answered()} / ${Q.length}</span>Completed</div></div>
 ${prev!==null?`<p>Your previous result: <b>${prev}%</b> ${pct>prev?'— you improved! 🎉':pct==prev?'— the same. Try to beat it!':'— you can beat it next time!'}</p>`:''}
 <p><b>Badges:</b> ${badges.length?badges.join(' · '):'Keep playing to earn badges!'}</p></div>
 <div class="card"><h2>📘 Your ICT Learning Report</h2>
 <p><b>Your strengths:</b> ${good.length?good.map(k=>TP[k]).join(', ')+' (all questions correct).':'You have started your learning journey. Let’s build strengths together!'}</p>
 <p><b>Keep practising:</b> ${weak.length?weak.map(k=>TP[k]+' ('+(tops[k].n-tops[k].ok)+' missed)').join(', ')+'.':'Nothing to fix. Excellent!'}</p>
 ${hardTy.length?`<p><b>Question types that were tricky:</b> ${hardTy.join(', ')}.</p>`:''}
 <p><b>Your next steps:</b></p><ul>${recs.slice(0,3).map(r=>'<li>'+r+'</li>').join('')}</ul></div>
 <div class="card" style="text-align:center"><button class="b" id="rt" ${bad?'':'disabled'}>🔁 RETRY INCORRECT QUESTIONS</button><button class="b" id="pa">▶ PLAY AGAIN — try to beat ${S.best}%</button><button class="b alt" id="sr">🔀 SHUFFLE AND REPLAY</button><button class="b alt" id="rv">📝 REVIEW ANSWERS</button></div>`;
 $('#rt').onclick=retry;$('#pa').onclick=()=>newGame(S.ids);$('#sr').onclick=()=>newGame();$('#rv').onclick=review;
}
function review(){
 A.innerHTML=`<div class="card"><h2>📝 Review answers</h2>${S.ids.concat([Q.length-1]).map(id=>{const q=Q[id],r=S.res[id];return `<div class="rv"><b>${r&&r.ok?'✅':'❌'} ${q.q}</b><br>Your answer: ${r?esc(r.resp):'—'}<br>Correct answer: <b>${esc(ansText(q))}</b></div>`}).join('')}<button class="b" id="bk">← Back to results</button></div>`;
 $('#bk').onclick=results;
}
/* ===== retry round (tracked separately; never changes the original score) ===== */
function retry(){
 const ids=sh(Object.keys(S.res).filter(k=>!S.res[k].ok).map(Number)),rr={};let i=0;
 const next=()=>{if(i>=ids.length)return rdone();const q=Q[ids[i]];showQ(q,(Math.random()*4)|0,(ok)=>{rr[q.id]=ok;i++;next()},false,'Retry '+(i+1)+'/'+ids.length)};
 const rdone=()=>{const fixed=ids.filter(id=>rr[id]).length;
  A.innerHTML=`<div class="card"><div class="big">${fixed==ids.length?'🎉':'💪'}</div><h2>Retry round finished</h2><p>You got <b>${fixed}</b> of <b>${ids.length}</b> right this time. ${fixed?'Wow, you improved!':'Keep practising, you will get them next time.'}</p>${ids.map(id=>`<div class="rv">${rr[id]?'⬆️ Improved':'🔁 Still learning'}: ${Q[id].q}</div>`).join('')}<p><small>Your original score of ${score()} / ${maxM} has not changed.</small></p><button class="b" id="bk">← Back to results</button></div>`;
  $('#bk').onclick=results};
 next();
}
/* ===== teacher key (open the page link with #key at the end) ===== */
function key(){
 A.innerHTML=`<div class="card"><h2>Teacher answer key — ICT Prim. 4, Lesson 6</h2><p>Total ${maxM} marks. Correct MCQ answers are placed in a balanced, random position (A–D) each game.</p><table><tr><th>#</th><th>Type</th><th>Topic</th><th>Marks</th><th>Question</th><th>Answer</th></tr>${Q.map((q,i)=>`<tr><td>${i+1}</td><td>${TY[q.ty]}</td><td>${TP[q.tp]}</td><td>${q.m}</td><td>${q.q.replace(/<[^>]+>/g,'')}</td><td><b>${esc(ansText(q))}</b></td></tr>`).join('')}</table><button class="b" onclick="location.hash='';cover()">Close</button></div>`;
}
addEventListener('hashchange',()=>location.hash=='#key'?key():cover());
location.hash=='#key'?key():cover();
</script></body></html>
